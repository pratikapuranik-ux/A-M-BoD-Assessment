<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">

<style>
:root{--navy:#002B49;--blue:#0085CA;--amber:#CF7F00;--teal:#00677F;--slate:#5E8AB4;--grey:#646464;--bg:#FFFFFF;--card:#FFFFFF;--ink:#1A1F2B;--muted:#646464;--line:#D9D9D9;--tint:#F3F8FC;--tint2:#DAF2FF;--label:#5B6B7B;

<script type="application/json" id="guardrails-data">{"intro": "How this assessment was bounded. Every item below is what the assessment actually does, enforced in the method, in the tooling, or both.","groups": [{"group": "Sources and evidence","items": ["Public and licensed sources only: regulators and exchanges, company filings and investor-relations material, earnings call transcripts, an approved news list, recognised trade press, proxy advisers and rating agencies. Social media, anonymous forums, unverified blogs, employee review sites and uncited AI summaries are excluded, and those domains are blocked in the retrieval tools.","Every finding rests on a numbered evidence item carrying the document, its date, the link or platform reference it was retrieved from, and a verbatim excerpt of under 15 words. A source that cannot be checked is not used, and the gap is stated.","Evidence minimums: a midpoint score on an indicator requires one evidence item; the extremes require two independent items from two different documents, or one strong source - an audited figure, a regulator or court record, or a formal act of the board.","An indicator that cannot be evidenced to that standard is recorded as not assessable, with its cause (disclosure-limited, retrieval-limited, rule-limited), and excluded from the average. It is never scored at the midpoint to fill the gap. The number of indicators assessed out of 22 is reported for the company and for every peer.","A dimension letter is reported only where at least half of that dimension's indicators are assessed, and two-thirds where board documents have been read. An overall grade is reported on four or more dimensions, marked provisional on exactly three, and withheld below that."]},{"group": "What is and is not assessed","items": ["The subject is the board as a body, over the assessment period stated on the cover, against a fixed framework of six dimensions and 22 indicators. Management performance, strategy quality and company valuation are not assessed.","What the company did under the board's watch is attributed to the board's oversight; there is no separate management score.","Peers are assessed on public information only, against the same 22 indicators, and are never re-assessed using this company's board documents or director responses. Peer grades and peer commentary are therefore the same in the outside-in and the inside-out view.","Comparisons are to the named peer set and to published sector data, never to another client's confidential information.","Board documents and director responses supplied for this engagement are used for this company's assessment only."]},{"group": "People and anonymity","items": ["No individual is graded, ranked or characterised, and no view is offered on any individual's competence or motive. Factual, filing-based statements about office-holders (role, tenure, appointment date, committee membership) are used where they bear on a finding. The text is scanned before release for named individuals, characterisation of people, legal conclusions and investment language.","The director self-assessment is anonymous. The inside-out view is prepared from director responses only once at least three directors have responded (the configured minimum); with fewer, no response is used and the view rests on board documents alone. Each question's answers are shuffled on their own so that a response number is a different director from one question to the next, and a refresh is held back until enough further responses have arrived that a single new one cannot be isolated.","Director responses are reported as themes across respondents, never as quotations. No answer, distinctive turn of phrase or recounted incident is reproduced, and the record behind a citation keeps the question, not the answer.","A director's own view, uncorroborated, can lower an indicator but cannot lift it above the midpoint or carry high confidence; that requires a board document or the public record.","No sensitive personal data, health data, pay or HR records are used."]},{"group": "Claims we do not make","items": ["No legal conclusion, such as breach of duty, and no finding of fraud or illegality.","No share-price view, price target or investment advice, and no prediction of outcomes. The grades describe what the record shows over the period assessed.","Actions are tied to a specific finding and do not recommend or reference any adviser's services.","The Day 1 / Day 2 framing is attributed to the Bezos concept of that name."]},{"group": "Review status","items": ["Draft. Requires review and approval by a qualified Alvarez and Marsal professional before use.","The run records its rule version, the assessment period, the document windows applied and how much was retrieved for each subject. Runs made on different rule versions are not compared.","This report is a single assessment run. The two-run consistency test described in the methodology was not applied to it.","The run mode shown on the cover sets who the assessment was prepared for and how it may be circulated."]}]}</script>
<script>
const RUN=__RUN__, FW=__FW__; const DIMS=Object.keys(FW.dimensions).sort((a,b)=>a-b); const IND=FW.indicators; const INDBY=Object.fromEntries(IND.map(i=>[i.id,i]));
const stage=RUN.run.stage||'outside_in'; const io=stage==='inside_out'; const L=FW.stages[stage].lenses; const LL=FW.stages[stage].labels; const last=L[L.length-1];
const company=RUN.subjects.find(s=>s.role==='company'), peers=RUN.subjects.filter(s=>s.role==='peer'); const C=company.computed; const hist=RUN.history||[]; const prev=hist.length?hist[hist.length-1]:null;
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortName=n=>{const s=(n||'').replace(/\s*\(.*\)\s*$/,'').replace(/[,.]?\s+(Corporation|Corp\.?|Incorporated|Inc\.?|p\.l\.c\.?|plc|Ltd\.?|Limited|Company|Co\.?|Holdings|Group|N\.V\.|S\.A\.|AG)$/i,'').trim(); return s||n;};
const SHORT=shortName(company.name);
const LV={A:5,B:4,C:3,D:2,F:1}; const gchip=(g,big)=>`<span class="g${big?' big':''} g${g||'NA'}">${g||'n/a'}</span>`; const schip=s=>`<span class="s s${s??'NA'}">${s??'n/a'}</span>`;
const delta=(n,o)=>(n&&o)?LV[n]-LV[o]:null; const dtxt=d=>d==null?'':d>0?`<span class="up">▲ ${d}</span>`:d<0?`<span class="down">▼ ${-d}</span>`:'<span class="small">=</span>';
const linkify=t=>esc(t).replace(/\[((?:[EXBKLN]|SA|IO)\d{2,3})\]/g,(m,id)=>`<button class="ec" title="${esc((RUN.evidence[id]||{}).document||id)}" onclick="event.stopPropagation();showEv(['${id}'],'${id}')">${id}</button>`);
const prevGrade=(d)=>prev?((prev.stage==='inside_out'&&prev.dimensions[d].board_io)?prev.dimensions[d].board_io.grade:prev.dimensions[d].board.grade):null;
const prevOverall=()=>prev?((prev.stage==='inside_out'&&prev.overall.board_io)?prev.overall.board_io.grade:prev.overall.board.grade):null;
const firstSent=t=>{t=(t||'').trim(); const m=t.match(/^[\s\S]*?[.!?](?=\s+[A-Z\[(]|\s*$)/); return (m?m[0]:t).trim();};
const endDot=t=>/[.!?]$/.test(t)?t:t+'.';
const closeModal="document.getElementById('modal').classList.remove('open')";
const toggle=id=>{const p=document.getElementById(id); if(!p) return; const o=p.classList.toggle('open'); document.querySelectorAll(`[data-for="${id}"] .tg`).forEach(b=>{b.textContent=b.dataset.t+(o?' ▴':' ▾');});}; window.toggle=toggle;
const tgBtn=(id,t)=>`<button class="tg" data-t="${t}" aria-label="${t}" onclick="event.stopPropagation();toggle('${id}')">${t} ▾</button>`;
// Movement is shown as arrow + number only. Baseline: outside-in grade at the inside-out stage, else the prior period.
const baseG=d=>io?C.dimensions[d].board.grade:prevGrade(d); const baseO=()=>io?C.overall.board.grade:prevOverall(); const sd=(n,o)=>(n!=null&&o!=null)?n-o:null;
const sents=(t,n)=>{const m=(t||'').trim().match(/[\s\S]+?[.!?](?=\s+[A-Z\[(]|\s*$)/g); return (m||(t?[t]:[])).slice(0,n).map(s=>s.trim()).join(' ');};
// Two-line "what changed": the run's own words only (what_moved, else the per-indicator change notes); empty when the run has none.
const chg2=()=>sents(RUN.what_moved||Object.values((io?RUN.io_change_notes:RUN.change_notes)||{}).map(firstSent).join(' '),2);
const APP=[]; // appendix sections {t,h}, rendered last

// ---- header
document.getElementById('title').textContent=`${company.name}: Day 1 / Day 2 Board Assessment${io?' — inside-out update':''}`;
(function(){const w=RUN.run.document_window||{};
 document.getElementById('meta').innerHTML=[`Period ${esc(RUN.run.period)}`,`Run date ${esc(RUN.run.run_date)}`,`Peers: ${peers.map(p=>esc(p.name)).join(', ')}`,`Window: behaviour from ${esc(w.behaviour_from||'n/a')}, trends from ${esc(w.trend_from||'n/a')}`,hist.length?`Trend vs ${hist.map(h=>esc(h.period)+(h.simulated?' (sim)':'')).join(', ')}`:''].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
 const ml=FW.run_modes[RUN.run.mode]||RUN.run.mode;
 document.getElementById('mode').innerHTML=`${io?'Outside-in plus board documents and self-assessment':'Outside-in, public information only'}${ml?` · ${esc(ml)}`:''}${RUN.run.simulated?' · <span class="sim">SIMULATED</span>':''} · <b class="draft">DRAFT ONLY — requires review and approval by a qualified Alvarez and Marsal professional before use</b>`;})();

// ---- executive summary (collapsed by default)
(function(){const pv=prevOverall(); const mv=!!(prev||io);
 const o=C.overall[last]; const tiles=`<div title="${esc(LL[last])}: ${esc(o.label||'')}">${gchip(o.grade,true)}<div class="lb">${mv?dtxt(delta(o.grade,baseO())):''}</div></div>`;
 const t0=(RUN.overall_summary||{})[last]; const osum=t0?`<p>${o.provisional?'<b>Provisional:</b> ':''}${linkify(t0)}</p>`:'';
 const c2=mv?chg2():'';
 let h=`<details class="exec" id="exec"><summary><span class="tiles">${tiles}</span><span class="hl">${esc(RUN.headline||'')} <span class="more">· open to read</span></span></summary><div class="xbody">${osum}`;
 h+=mv?(c2?`<h4>What changed</h4><p>${linkify(c2)}</p>`:''):`<h4>What drives the rating</h4><p>${linkify(RUN.what_moved||'')}</p>`;
 if(io&&RUN.inside_vs_outside){h+=`<div class="two" style="margin-top:10px"><div><h4 style="margin-top:0">Better than the public evidence suggested</h4>${(RUN.inside_vs_outside.better||[]).map(x=>`<p>• ${linkify(x)}</p>`).join('')}</div><div><h4 style="margin-top:0">Worse than the public evidence suggested</h4>${(RUN.inside_vs_outside.worse||[]).map(x=>`<p>• ${linkify(x)}</p>`).join('')}</div></div>`;}
 h+=`<h4>Key actions</h4>`+(RUN.actions||[]).slice(0,5).map(a=>`<p>▸ <b>${esc(a.heading)}.</b> ${linkify(endDot(firstSent(a.description)))}</p>`).join('');
 h+=`<h4>Position relative to peers</h4><p>${linkify(RUN.peer_position||'')}</p>`+(RUN.peer_summary_lines||[]).map(x=>`<p>• ${linkify(x)}</p>`).join('')+`</div></details>`;
 document.getElementById('summary').innerHTML=h;})();

// ---- scorecard
function dimPanel(d){
 const ids=IND.filter(i=>i.dimension===d); const cd=C.dimensions[d][last]; const sc=ids.map(i=>({i,s:((company.indicators[i.id]||{})[last]||{}).score})).filter(x=>x.s!=null);
 let intro='';
 if(!sc.length) intro=`No indicator in ${esc(FW.dimensions[d])} could be assessed in this run.`;
 else{const hi=sc.reduce((a,b)=>b.s>a.s?b:a), lo=sc.reduce((a,b)=>b.s<a.s?b:a); const avg=cd.average!=null?cd.average:sc.reduce((t,x)=>t+x.s,0)/sc.length;
  const rat=x=>linkify(endDot(firstSent(((company.indicators[x.i.id]||{})[last]||{}).rationale||''))).replace(/<\/button>\.$/,'</button>.');
  intro=`${esc(SHORT)} averages ${Number(avg).toFixed(2)} on ${esc(FW.dimensions[d])}. `+((hi.s===lo.s||hi.i.id===lo.i.id)?`All ${sc.length} indicators score ${hi.s}.`:`<b>Strongest:</b> ${hi.i.id} — ${rat(hi)} <b>Weakest:</b> ${lo.i.id} — ${rat(lo)}`);}
 // one current score per indicator; at the inside-out stage an arrow + number shows the move from outside-in (both scores sit in the appendix table)
 let h=`<p>${intro}</p><div class="scroll"><table><thead><tr><th>Indicator</th><th class="center">Score</th>${io?'<th class="center">Change</th>':''}<th>Conf.</th><th>Evidence</th></tr></thead><tbody>`;
 ids.forEach(i=>{const ind=company.indicators[i.id]||{}; const lc=ind[last]||{}; const b=(ind.board||{}).score;
  h+=`<tr><td>${i.id} ${esc(i.name)} <button class="info ind" title="Definition and anchors" aria-label="Definition and anchors" onclick="event.stopPropagation();showInd('${i.id}')">?</button></td><td class="center">${schip(lc.score)}</td>${io?`<td class="center">${b==null&&lc.score!=null?'<span class="up">new</span>':dtxt(sd(lc.score,b))}</td>`:''}<td class="small">${esc(lc.confidence||lc.na_cause||'')}</td><td>${linkify(lc.rationale||(lc.score==null?'Not assessable.':''))} ${(lc.evidence||[]).length?`<button class="info" title="Evidence for this indicator" aria-label="Evidence list" onclick="event.stopPropagation();showEv(${JSON.stringify(lc.evidence).replace(/"/g,'&quot;')},'${i.id} ${esc(i.name)}')">i</button>`:''}</td></tr>`;});
 const lim=(company.limitations||{})[d]; h+=`</tbody></table></div>${lim?`<p class="lim"><b>Where this grade is limited:</b> ${linkify(lim)}</p>`:''}`; return h;}
(function(){
 const mv=!!(prev||io); document.getElementById('sck').textContent=prev?'Scorecard and trend':'Scorecard'; const nc=1+hist.length+1+(mv?1:0)+3;
 let h='<table><thead><tr><th>Dimension</th>'+hist.map(x=>`<th class="center">${esc(x.period)}${x.simulated?' (sim)':''}</th>`).join('')+'<th class="center">Grade</th>'+(mv?`<th class="center">${io?'Change vs outside-in':'Change vs '+esc(prev.period)}</th>`:'')+'<th class="center">Assessed</th><th>Evidence in this run</th><th style="text-align:right">'+'</th></tr></thead><tbody>';
 DIMS.forEach(d=>{const cur=C.dimensions[d][last].grade; const ch=dtxt(delta(cur,baseG(d)));
  h+=`<tr class="row" data-for="sd${d}" onclick="toggle('sd${d}')"><td class="vm"><b>${d}. ${esc(FW.dimensions[d])}</b></td>`+hist.map(x=>`<td class="center vm">${gchip((x.stage==='inside_out'&&x.dimensions[d].board_io)?x.dimensions[d].board_io.grade:x.dimensions[d].board.grade)}</td>`).join('')+`<td class="center vm">${gchip(cur)}</td>`+(mv?`<td class="center vm">${ch}</td>`:'')+`<td class="center vm">${C.dimensions[d][last].assessed}/${C.dimensions[d][last].of}</td><td class="small">${linkify((RUN.scorecard_headline||{})[d]||'')}</td><td class="vm" style="text-align:right">${tgBtn('sd'+d,'indicators')}</td></tr>`;
  h+=`<tr><td class="pcell" colspan="${nc}"><div class="detail" id="sd${d}">${dimPanel(d)}</div></td></tr>`;});
 const o=C.overall;
 h+=`<tr><td class="vm"><b>Overall</b></td>`+hist.map(x=>`<td class="center vm">${gchip((x.stage==='inside_out'&&x.overall.board_io)?x.overall.board_io.grade:x.overall.board.grade)}</td>`).join('')+`<td class="center vm">${gchip(o[last].grade)}${o[last].provisional?'<div class="prov">PROVISIONAL</div>':''}</td>`+(mv?`<td class="center vm">${dtxt(delta(o[last].grade,baseO()))}</td>`:'')+`<td class="center vm">${o[last].dimensions_reported} dims${o[last].provisional?' <span class="prov">(provisional)</span>':''}</td><td class="small">Rounded average of dimension letters (midpoints round down).</td><td></td></tr></tbody></table>`;
 document.getElementById('scorecard').innerHTML=h;
 const cv=C.coverage[last]; const sp=cv.not_assessable||{}; const causes=Object.entries(sp).filter(([k,v])=>v>0).map(([k,v])=>`${v} ${k}`);
 document.getElementById('sccov').textContent=`Coverage: ${cv.assessed} of ${cv.of} indicators assessed.${causes.length?' Not assessable: '+causes.join(', ')+'.':''} `+(io?'Post inside-out grades use the board documents and self-assessment supplied; arrows show the move from the outside-in grade.':'Grades rest on outside-in information; non public board documents will help at a more accurate grade.');
 let c2='';
 if(prev){const rows=IND.filter(i=>{const c=(company.indicators[i.id]||{}).board||{}; const p=(prev.indicators[i.id]||{}).board; return c.score!=null&&p!=null&&c.score!==p;});
  if(rows.length){c2+=`<div class="kicker">What changed since ${esc(prev.period)}${prev.simulated?' (simulated prior)':''}</div><div class="card flush scroll"><table><thead><tr><th>Indicator</th><th class="center">Prior</th><th class="center">Now</th><th class="center">Δ</th><th>Evidence that moved the score</th></tr></thead><tbody>${rows.map(i=>{const c=company.indicators[i.id].board; const p=prev.indicators[i.id].board; return `<tr><td><b>${i.id}</b> ${esc(i.name)}</td><td class="center">${schip(p)}</td><td class="center">${schip(c.score)}</td><td class="center">${dtxt(c.score-p)}</td><td class="small">${linkify((RUN.change_notes||{})[i.id]||firstSent(c.rationale||''))}</td></tr>`;}).join('')}</tbody></table></div>`;}}
 if(io){const rows=IND.filter(i=>{const a=((company.indicators[i.id]||{}).board||{}).score, b=((company.indicators[i.id]||{}).board_io||{}).score; return b!=null&&a!==b;});
  // indicator-level pair table lives in the appendix (the body shows arrow + number only)
  if(rows.length){APP.push({t:'Indicator-level comparison: outside-in to post inside-out ('+rows.length+' moved)',h:`<div class="scroll"><table><thead><tr><th>Indicator</th><th class="center">Outside-in</th><th class="center">Post inside-out</th><th class="center">Δ</th><th>Outside-in evidence, then what the board documents added</th></tr></thead><tbody>${rows.map(i=>{const a=company.indicators[i.id].board.score, b=company.indicators[i.id].board_io.score; return `<tr><td><b>${i.id}</b> ${esc(i.name)}</td><td class="center">${schip(a)}</td><td class="center">${schip(b)}</td><td class="center">${a==null?'<span class="up">new</span>':dtxt(b-a)}</td><td class="small">${linkify((RUN.io_change_notes||{})[i.id]||(company.indicators[i.id].board_io.rationale||''))}</td></tr>`;}).join('')}</tbody></table></div>`});}}
 document.getElementById('changes').innerHTML=c2;
 const t2=mv?chg2():''; document.getElementById('scchg').innerHTML=t2?`<p class="sub"><b>What changed${io?' (outside-in to post inside-out)':' since '+esc(prev.period)}:</b> ${linkify(t2)}</p>`:'';})();

// ---- modals
// Anonymity: a director's free-text answer is never shown; the question and a synthesis note stand in for it.
const isSA=e=>e&&e.evidence_class==='self_assessment';
const saQ=(eid,e)=>{if(e.question) return e.question; const m=/^SA(\d+)$/.exec(eid); const q=m&&(FW.questionnaire||[])[+m[1]-1]; return q?q[2]:'';};
function evHtml(eid){const e=RUN.evidence[eid]; if(!e) return `<div class="ev small">${esc(eid)} missing</div>`; const sa=isSA(e); return `<div class="ev"><span class="src">${esc(eid)} ${esc(e.document)}</span> <span class="small">${esc(e.date||'')} · ${esc(e.evidence_class||'direct')}${e.source_origin?' · '+esc(e.source_origin):''}</span> ${e.simulated?'<span class="sim">SIMULATED</span>':''} ${e.recent?'<span class="recent">RECENT</span>':''}${(sa?saQ(eid,e):e.question)?`<div class="small">Q: ${esc(sa?saQ(eid,e):e.question)}</div>`:''}${sa?'<div class="small"><i>Director responses are synthesised, not quoted.</i></div>':e.excerpt?`<div class="exc">${esc(e.excerpt)}</div>`:''}${e.search_log?`<div class="small">Search: ${esc(e.search_log)}</div>`:''}${e.url?`<div class="small"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a></div>`:''}</div>`;}
function showEv(ids,title){document.getElementById('modalBox').innerHTML=`<span class="x" onclick="${closeModal}">×</span><h3>${esc(title)}</h3>`+ids.map(evHtml).join(''); document.getElementById('modal').classList.add('open');} window.showEv=showEv;
function showInd(id){const i=INDBY[id]; const ov=(FW.outside_in_overrides||{})[id]; const an=(ov&&!io)?ov.anchors:i.anchors; document.getElementById('modalBox').innerHTML=`<span class="x" onclick="${closeModal}">×</span><h3>${i.id} ${esc(i.name)}</h3><p>${esc(i.definition)}</p>${(ov&&!io)?'<p class="small">Outside-in anchors applied.</p>':''}<table><tr><th>1 – Day 2</th><td>${esc(an['1'])}</td></tr><tr><th>3 – Mixed</th><td>${esc(an['3'])}</td></tr><tr><th>5 – Day 1</th><td>${esc(an['5'])}</td></tr></table><p><b>Board prompt:</b> ${esc(i.board_lens)}</p><p class="small">Sources: ${esc(i.source_types)} · Public availability: ${esc((ov&&ov.availability)||i.availability)}</p>`; document.getElementById('modal').classList.add('open');} window.showInd=showInd;

// ---- peers
(function(){
 const rs=RUN.peer_row_summary||{}; const subs=[company].concat(peers);
 let h='<table><thead><tr><th>Dimension</th><th class="center">'+esc(SHORT)+' (company)</th>'+peers.map(p=>`<th class="center">${esc(p.name)}</th>`).join('')+'<th>How the company compares</th><th></th></tr></thead><tbody>';
 const nc=peers.length+4;
 DIMS.forEach(d=>{h+=`<tr class="row" data-for="pd${d}" onclick="toggle('pd${d}')"><td class="vm"><b>${d}. ${esc(FW.dimensions[d])}</b></td><td class="center vm">${gchip(C.dimensions[d].board.grade)}</td>${peers.map(p=>`<td class="center vm">${gchip(p.computed.dimensions[d].board.grade)}</td>`).join('')}<td class="small">${linkify(rs[d]||(RUN.comparative_evidence||{})[d]||'')}</td><td class="vm" style="text-align:right">${tgBtn('pd'+d,'detail')}</td></tr>`;
  h+=`<tr><td class="pcell" colspan="${nc}"><div class="detail" id="pd${d}">${subs.map(s=>`<p style="margin:0 0 4px"><b>${esc(s.name)}</b> ${gchip(s.computed.dimensions[d].board.grade)}</p>${s.summary?`<p class="small">${linkify(s.summary)}</p>`:''}<div class="scroll" style="margin-bottom:12px"><table><thead><tr><th>Indicator</th><th class="center">Score</th><th>Rationale</th></tr></thead><tbody>${IND.filter(i=>i.dimension===d).map(i=>{const c=((s.indicators||{})[i.id]||{}).board||{}; return `<tr><td>${i.id} ${esc(i.name)}</td><td class="center">${schip(c.score)}</td><td class="small">${linkify(c.rationale||(c.score==null?'Not assessable.':''))}</td></tr>`;}).join('')}</tbody></table></div>`).join('')}</div></td></tr>`;});
 h+=`<tr><td class="vm"><b>Overall</b></td><td class="center vm">${gchip(C.overall.board.grade)}</td>${peers.map(p=>`<td class="center vm">${gchip(p.computed.overall.board.grade)}</td>`).join('')}<td class="small">${linkify(RUN.peer_position||'')}</td><td></td></tr></tbody></table>`;
 document.getElementById('peers').innerHTML=h;
 document.getElementById('peernote').textContent=(io?'Peers are compared on outside-in grades only; their inside-out information is not available, so the company\'s outside-in grade is used. ':'')+'Peers are assessed on public information with the same retrieval set and rubric. Select a row to see every company\'s indicator scores and rationale for that dimension.';
 if(prev&&prev.peers&&Object.keys(prev.peers).length){document.getElementById('peertrend').innerHTML=`<div class="kicker">Peer trend: ${esc(prev.period)} to ${esc(RUN.run.period)} (overall)</div><div class="card flush scroll"><table><thead><tr><th>Quarter</th>${peers.map(p=>`<th class="center">${esc(p.name)}</th>`).join('')}</tr></thead><tbody><tr><td>${esc(prev.period)}</td>${peers.map(p=>`<td class="center">${gchip((prev.peers[p.name]||{}).overall)}</td>`).join('')}</tr><tr><td>${esc(RUN.run.period)}</td>${peers.map(p=>`<td class="center">${gchip(p.computed.overall.board.grade)}</td>`).join('')}</tr></tbody></table></div>`;}})();

// ---- reconciliation (optional)
(function(){const rc=RUN.run&&RUN.run.reconciliation?RUN.run.reconciliation:RUN.reconciliation; if(!rc||typeof rc!=='object') return;
 const rows=rc.rows||[]; const m=rc.models||{}; const ml=k=>{const x=m[k]||{}; return `${esc(x.model||'model')}, ${esc(x.effort||'n/a')} effort`;};
 const sv=v=>v==null?'n/a':v;
 let h=`<div class="kicker">Reconciliation</div><h2>Where the two runs differed</h2><p class="small" style="margin:0 0 10px">Run A (${ml('A')}) and Run B (${ml('B')}) agreed on ${esc(rc.agreed)} of ${esc(rc.total)} indicator scores; ${rows.length} ${rows.length===1?'was':'were'} reconciled and the model's recommendation is the final score.</p><div class="card flush scroll">`;
 if(!rows.length) h+=`<p style="padding:14px 18px;margin:0">Both runs agreed on every indicator score; nothing needed reconciling.</p>`;
 else h+=`<table><thead><tr><th>Cell</th><th class="center">Score (Run A / Run B)</th><th class="center">Final score</th><th>Reason</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.indicator)}</b> ${esc(r.name)}${r.role==='peer'?`<div class="small">${esc(r.subject)}</div>`:''}</td><td class="center">${sv(r.a)} / ${sv(r.b)}</td><td class="center">${schip(r.final)}${r.chosen?`<div class="small">Run ${esc(r.chosen)}'s score stands</div>`:''}</td><td class="small">${linkify(r.reason||'')}</td></tr>`).join('')}</tbody></table>`;
 document.getElementById('recon').innerHTML=h+'</div>';})();

// ---- actions
(function(){if(io) document.getElementById('acth').textContent='What the board could do next (updated after the inside-out review)';
 let h=(RUN.actions||[]).slice(0,5).map((a,k)=>`<div class="action"><h3>${String(k+1).padStart(2,'0')}&nbsp; ${esc(a.heading)}</h3><p>${linkify(a.description)}</p>${a.improves?`<div class="imp small" style="color:var(--ink)"><b>Improves:</b> ${linkify(a.improves)}</div>`:''}${(a.measures||[]).length||a.target_by?`<div class="m">${(a.measures||[]).length?'Measures: '+a.measures.map(esc).join('; '):''}${a.target_by?' &nbsp; Target: '+esc(a.target_by):''}</div>`:''}</div>`).join('')||'<p class="small">No actions recorded.</p>';
 const pas=RUN.prior_actions_status||[];
 if(pas.length){h+=`<div class="kicker" style="margin-top:14px">Status of actions from ${esc(prev?prev.period:'the prior report')}</div><div class="scroll"><table><thead><tr><th>Action</th><th>Status</th><th>Evidence and metrics</th></tr></thead><tbody>${pas.map(p=>`<tr><td><b>${esc(p.heading||p.id)}</b></td><td><span class="st st-${esc(p.status)}">${esc((p.status||'').replace(/_/g,' '))}</span></td><td class="small">${linkify(p.evidence_note||'')}${p.metrics_note?' Metrics: '+esc(p.metrics_note):''}</td></tr>`).join('')}</tbody></table></div>`;}
 else if(prev&&(prev.actions||[]).length&&!io){h+=`<p class="small" style="margin-top:12px">Actions from ${esc(prev.period)}: status cannot be established from public information; it will be asked for in the inside-out stage.</p>`;}
 document.getElementById('actions').innerHTML=h;
 const bot=RUN.back_on_track||[]; if(bot.length){document.getElementById('bot').innerHTML=`<div class="kicker">Getting back on track</div><h2>Actions behind or not started</h2><div class="card flush scroll"><table><thead><tr><th>Action</th><th>What happened</th><th>Impact</th><th>Root cause</th><th>Mechanism to prevent</th><th>Measures to track</th></tr></thead><tbody>${bot.map(b=>`<tr><td><b>${esc(b.heading||b.id)}</b></td><td class="small">${linkify(b.what_happened)}</td><td class="small">${linkify(b.impact)}</td><td class="small">${linkify(b.root_cause)}</td><td class="small">${linkify(b.prevention)}</td><td class="small">${esc(Array.isArray(b.measures)?b.measures.join('; '):b.measures)}</td></tr>`).join('')}</tbody></table></div>`;}
 const ain=RUN.additional_information_needed||[]; if(ain.length){document.getElementById('ain').innerHTML=`<div class="kicker">Additional information that would sharpen the assessment</div><div class="card">${ain.map(x=>`<p style="margin:4px 0">• ${esc(x)}</p>`).join('')}</div>`;}})();

// ---- coverage
(function(){const cv=C.coverage[last]; const cov=RUN.coverage||{}; const cell=i=>(company.indicators[i.id]||{})[last]||{};
 const na=IND.filter(i=>cell(i).score==null).map(i=>`${i.id} ${i.name}${cell(i).na_cause?' ('+cell(i).na_cause+')':''}`); const sp=cv.not_assessable||{}; const confs={High:0,Medium:0,Low:0}; IND.forEach(i=>{const c=cell(i); if(c.score!=null&&confs[c.confidence]!=null) confs[c.confidence]++;});
 const sim=Object.values(RUN.evidence).filter(e=>e.simulated).length;
 // all three na_cause values get a tile (rule-limited was invisible before); any unknown cause is appended
 const CAUSE={'disclosure-limited':'disclosure-limited (the company)','retrieval-limited':'retrieval-limited (the run)','rule-limited':'rule-limited (evidence below the minimum)'};
 const causeTiles=Object.keys(CAUSE).concat(Object.keys(sp).filter(k=>!(k in CAUSE)&&sp[k])).map(k=>`<div><div class="n">${sp[k]||0}</div><div class="l">${esc(CAUSE[k]||k)}</div></div>`).join('');
 // documents the company's grades actually cite (either lens), deduplicated; director self-assessment answers are not documents
 const cited=new Set(); IND.forEach(i=>['board','board_io'].forEach(l=>(((company.indicators[i.id]||{})[l]||{}).evidence||[]).forEach(e=>cited.add(e))));
 const docs=[...new Set([...cited].map(e=>RUN.evidence[e]).filter(e=>e&&!isSA(e)).map(e=>e.document))];
 const un=cov.documents_unavailable||[];
 document.getElementById('coverage').innerHTML=`<details class="exec" id="covd"><summary><span class="hl">${cv.assessed} of ${cv.of} indicators assessed <span class="more">· documents, gaps and confidence · open to read</span></span></summary><div class="xbody"><div class="stat" style="margin-top:12px">${causeTiles}<div><div class="n">${confs.High} · ${confs.Medium} · ${confs.Low}</div><div class="l">confidence High · Medium · Low</div></div>${sim?`<div><div class="n">${sim}</div><div class="l">simulated evidence items</div></div>`:''}</div><p><b>Not assessable:</b> ${na.length?na.map(esc).join('; '):'none'}</p><p><b>Documents available (${docs.length}):</b> ${docs.map(esc).join('; ')||'none'}</p><p><b>Documents unavailable:</b> ${un.map(esc).join('; ')||'none'}</p>${cov.notes?`<p class="small">${esc(cov.notes)}</p>`:''}</div></details>`;})();

// ---- guardrails: text is the JSON block in #guardrails-data (also parsed by app/domain/view.py, so one source); rendered as written, never paraphrased
(function(){const G=JSON.parse(document.getElementById('guardrails-data').textContent);
 APP.push({t:'Guardrails',h:`<p>${esc(G.intro)}</p>${G.groups.map(x=>`<h4>${esc(x.group)}</h4>${x.items.map(i=>`<p>• ${esc(i)}</p>`).join('')}`).join('')}`});})();

// ---- appendix (collapsed): director self-assessment themes, then any sections other blocks queued in APP
(function(){if(!io) return; const th=RUN.self_assessment_themes||[]; const n=RUN.self_assessment_responses; if(!th.length&&n==null&&!Object.values(RUN.evidence).some(isSA)) return;
 // themes are synthesised upstream; if absent we state only the response count (never the answers)
 APP.push({t:'Director self-assessment: themes',h:(th.length?th.map(x=>`<p><b>${esc(x.dimension)}. ${esc(FW.dimensions[x.dimension]||'')}${x.theme?': '+esc(x.theme):''}</b></p><p>${esc(x.summary)}</p>`).join(''):`<p>${n===0?'Prepared from board documents only, without a director self-assessment.':n>0?n+' director '+(n===1?'response':'responses')+' received; themes have not been synthesised for this run.':'Themes have not been synthesised for this run.'}</p>`)+'<p class="small">Director responses are synthesised, not quoted.</p>'});})();
(function(){if(!APP.length) return; document.getElementById('appx').innerHTML='<div class="kicker">Appendix</div>'+APP.map(a=>`<details class="acc" style="margin-bottom:8px"><summary>${esc(a.t)}</summary><div class="accbody">${a.h}</div></details>`).join('');})();

// ---- evidence accordion
(function(){const fDim=document.getElementById('fDim'),fO=document.getElementById('fOrigin'),fInd=document.getElementById('fInd'),fText=document.getElementById('fText');
 DIMS.forEach(d=>fDim.insertAdjacentHTML('beforeend',`<option value="${d}">${d}. ${esc(FW.dimensions[d])}</option>`)); ['public','user_public','inside_out','self_assessment'].forEach(o=>fO.insertAdjacentHTML('beforeend',`<option value="${o}">${o.replace('_',' ')}</option>`)); IND.forEach(i=>fInd.insertAdjacentHTML('beforeend',`<option value="${i.id}">${i.id} ${esc(i.name)}</option>`));
 const uses={}; RUN.subjects.forEach(s=>IND.forEach(i=>['board','board_io'].forEach(l=>{const c=((s.indicators||{})[i.id]||{})[l]; (c?.evidence||[]).forEach(e=>{(uses[e]=uses[e]||[]).push({ind:i.id,dim:i.dimension,sub:s.name,l});});})));
 function render(){const q=fText.value.toLowerCase(); const list=Object.keys(RUN.evidence).filter(eid=>{const u=uses[eid]||[]; const e=RUN.evidence[eid]; const orig=e.source_origin||'public'; if(fDim.value&&!u.some(x=>x.dim===fDim.value)) return false; if(fO.value&&orig!==fO.value) return false; if(fInd.value&&!u.some(x=>x.ind===fInd.value)) return false; if(q&&!(`${e.document} ${isSA(e)?'':e.excerpt} ${e.date}`.toLowerCase().includes(q))) return false; return true;});
  document.getElementById('evList').innerHTML=list.length?list.map(eid=>evHtml(eid)+`<div class="small" style="margin:-4px 0 10px 12px">Used in: ${(uses[eid]||[]).map(x=>`<span class="chip">${esc(x.sub===company.name?'':x.sub+' ')}${x.ind} ${esc((INDBY[x.ind]||{}).name||'')}${x.l==='board_io'?' (post inside-out)':''}</span>`).join('')||'<span class="chip">context</span>'}</div>`).join(''):'<p class="small">No evidence matches the filters.</p>';}
 [fDim,fO,fInd].forEach(x=>x.onchange=render); fText.oninput=render; render();})();
document.getElementById('method').innerHTML=`Grade scale (average indicator score): ${FW.grade_scale.map(b=>`${b.grade} ${FW.grade_scale_ranges[b.grade]} ${b.label}`).join(' · ')}. Every indicator is scored once, for the board; management's observable actions are attributed to the board's oversight. Overall grades are the rounded average of dimension letters (midpoints round down); provisional when only three dimensions are reported. Rules v${FW.rule_version}. Framework based on Jeff Bezos's Day 1 / Day 2 concept.<br><b class="draft">⚠ DRAFT ONLY — Requires review and approval by a qualified Alvarez and Marsal professional before use.</b>`;
</script></body></html>
