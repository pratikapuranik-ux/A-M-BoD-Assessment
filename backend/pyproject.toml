[project]
name = "am-bod-assessment-backend"
version = "0.1.0"
description = "A&M BoD Assessment backend (FastAPI + LangGraph + SQLAlchemy)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
